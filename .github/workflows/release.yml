name: Build installers (repositorio público — no consume facturación)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publica la release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  SOURCE_REPO: FaidersAltamar/bravo-antidect
  VERSION: ${{ inputs.version }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout código privado
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version override
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          node -e "require('fs').writeFileSync('release-version.json', JSON.stringify({version: process.env.VERSION}))"

      - name: Build (directo)
        env:
          ENV_NAME: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build --features production --target x86_64-pc-windows-msvc --config release-version.json

      - name: Subir instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name="v${VERSION}" -f name="Bravo Antidect v${VERSION}" -f draft=true -f body="Instaladores de Bravo Antidect." >/dev/null || true
          cd src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          cp "Bravo Antidect_${VERSION}_x64-setup.exe" "Bravo_${VERSION}_x64-setup.exe"
          cp "Bravo Antidect_${VERSION}_x64-setup.exe.sig" "Bravo_${VERSION}_x64-setup.exe.sig"
          gh release upload "v${VERSION}" --repo "${{ github.repository }}" --clobber "Bravo_${VERSION}_x64-setup.exe" "Bravo_${VERSION}_x64-setup.exe.sig"

  build-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout código privado
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Instalar certificado Apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/bravo-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Version override
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          node -e "require('fs').writeFileSync('release-version.json', JSON.stringify({version: process.env.VERSION}))"

      - name: Build (directo)
        env:
          ENV_NAME: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --features production --target ${{ matrix.target }} --config release-version.json

      - name: Subir artefactos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name="v${VERSION}" -f name="Bravo Antidect v${VERSION}" -f draft=true -f body="Instaladores de Bravo Antidect." >/dev/null || true
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"
          cd "$BUNDLE/macos"
          cp "Bravo Antidect.app.tar.gz" "Bravo_${VERSION}_${ARCH}.app.tar.gz"
          cp "Bravo Antidect.app.tar.gz.sig" "Bravo_${VERSION}_${ARCH}.app.tar.gz.sig"
          cd ../dmg
          cp "Bravo Antidect_${VERSION}_${ARCH}.dmg" "Bravo_${VERSION}_${ARCH}.dmg"
          cd "$GITHUB_WORKSPACE/$BUNDLE/macos"
          gh release upload "v${VERSION}" --repo "${{ github.repository }}" --clobber             "Bravo_${VERSION}_${ARCH}.app.tar.gz"             "Bravo_${VERSION}_${ARCH}.app.tar.gz.sig"             "../dmg/Bravo_${VERSION}_${ARCH}.dmg"

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout código privado
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version override
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          node -e "require('fs').writeFileSync('release-version.json', JSON.stringify({version: process.env.VERSION}))"

      - name: Build (directo)
        env:
          ENV_NAME: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build --features production --target x86_64-unknown-linux-gnu --config release-version.json

      - name: Subir artefactos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name="v${VERSION}" -f name="Bravo Antidect v${VERSION}" -f draft=true -f body="Instaladores de Bravo Antidect." >/dev/null || true
          BUNDLE="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          cd "$BUNDLE"
          for f in *"${VERSION}"*.AppImage*; do
            base=$(basename "$f")
            case "$base" in
              *.sig) cp "$f" "Bravo_${VERSION}_amd64.AppImage.sig" ;;
              *) cp "$f" "Bravo_${VERSION}_amd64.AppImage" ;;
            esac
          done
          gh release upload "v${VERSION}" --repo "${{ github.repository }}" --clobber "Bravo_${VERSION}_amd64.AppImage" "Bravo_${VERSION}_amd64.AppImage.sig"

  finalize:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código privado (scripts de manifiestos)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar latest.json de las firmas
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "bravo-release"
          $signatureDir = Join-Path $releaseDir "signatures"
          $manifestDir = Join-Path $releaseDir "manifests"
          New-Item -ItemType Directory -Path $signatureDir -Force | Out-Null
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          $releaseMetadataPath = Join-Path $releaseDir "release.json"
          $releaseAssetsPath = Join-Path $releaseDir "assets.json"
          gh api "repos/$env:REPOSITORY/releases/tags/v$env:VERSION" | Out-File $releaseMetadataPath -Encoding utf8
          gh api --paginate --slurp "repos/$env:REPOSITORY/releases/tags/v$env:VERSION/assets?per_page=100" | Out-File $releaseAssetsPath -Encoding utf8
          gh release download "v$env:VERSION" --pattern "*.sig" --dir $signatureDir --clobber
          node deploy/generate-updater-manifests.mjs $releaseMetadataPath $releaseAssetsPath $signatureDir $manifestDir $env:REPOSITORY
          gh release upload "v$env:VERSION" (Join-Path $manifestDir "latest.json") (Join-Path $manifestDir "latest-fixed.json") --clobber

      - name: Publicar release
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ env.VERSION }}" --draft=false --latest
